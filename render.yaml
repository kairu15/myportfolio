# Render Blueprint — one-click deployment of the static portfolio.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: kylle-portfolio
    runtime: static
    # `npm ci` installs the exact dependency tree from package-lock.json.
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
    routes:
      # SPA fallback: every path serves index.html, so refreshing or opening a
      # deep link returns the app instead of Render's 404 page.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Filenames under /assets contain a content hash, so they can be cached
      # forever. index.html is left revalidating so new deploys are picked up.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
