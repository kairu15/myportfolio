    <!-- Apply saved appearance before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var el = document.documentElement;
          var theme = localStorage.getItem('theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          }
          el.dataset.theme = theme;

          var accent = localStorage.getItem('accent');
          el.dataset.accent =
            accent === 'teal' || accent === 'clay' || accent === 'indigo'
              ? accent
              : 'indigo';

          var backdrops = ['waves', 'slats', 'dots', 'plain'];
          var backdrop = localStorage.getItem('backdrop');
          if (backdrops.indexOf(backdrop) === -1) {
            backdrop = localStorage.getItem('background') === 'dots' ? 'dots' : 'waves';
          }
          el.dataset.backdrop = backdrop;
        } catch (error) {
          /* storage blocked — keep the defaults written in the html tag */
        }
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Kylle Ian Acibron",
        "jobTitle": "Aspiring Web Developer",

        "url": "https://kylle-portfolio.onrender.com/",
        "address": {

        },

        },

  <body>
    <!-- Boot loader: a tiny terminal that "boots" the portfolio while the JS
         bundle downloads and parses. Pure HTML/CSS (no JS needed to show),
         theme-aware via the same no-flash appearance script above, sitting
         outside #root so React never has to clear it — the inline script below
         dismisses it the moment React mounts. -->
    <div id="boot-loader" aria-hidden="true">
      <div class="bl-term">
        <div class="bl-bar">
          <span class="bl-title">kylle@portfolio:~</span>
          <span class="bl-tag">boot</span>
        </div>
        <div class="bl-body">
          <p class="bl-line bl-l1"><span class="bl-accent">$</span> kylle --init</p>
          <p class="bl-line bl-l2">
            <span class="bl-mute">&gt;</span> resolving stack <span class="bl-mute">......</span>
            <span class="bl-ok">ok</span>
          </p>
          <p class="bl-line bl-l3">
            <span class="bl-mute">&gt;</span> mounting projects <span class="bl-mute">....</span>
            <span class="bl-ok">ok</span>
          </p>
          <p class="bl-line bl-l4">
            <span class="bl-mute">&gt;</span> waking supervisors <span class="bl-mute">...</span>
            <span class="bl-ok">ok</span>
          </p>
          <p class="bl-line bl-l5">
            <span class="bl-mute">&gt;</span> <span class="bl-accent">ready</span><span class="bl-cursor"></span>
          </p>
        </div>
      </div>
      <p class="bl-name">Kylle Ian Acibron</p>
      <p class="bl-role">aspiring web developer</p>
      <div class="bl-track"><span class="bl-thumb"></span></div>
    </div>

    <div id="root"></div>

    <style>
      /* Boot loader — themed through --boot-* custom properties written for
         both themes (the site's tokens.css is bundled with the JS and is not
         available during first paint, so these mirror its values). */
      #boot-loader {
        --boot-bg: #fbfaf7;
        --boot-card: #ffffff;
        --boot-border: #e3e0d8;
        --boot-text: #14171c;
        --boot-mute: #67707e;
        --boot-accent: #4f46e5;
        --boot-ok: #15803d;
        --boot-track: #eceae3;
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 0.9rem;
        padding: 1.25rem;
        background: var(--boot-bg);
        font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas,
          'Liberation Mono', monospace;
        transition: opacity 0.38s ease, visibility 0.38s ease;
      }

      [data-theme='dark'] #boot-loader {
        --boot-bg: #0c0f14;
        --boot-card: #12161d;
        --boot-border: #232a35;
        --boot-text: #f0f2f6;
        --boot-mute: #8b95a4;
        --boot-accent: #a5b4fc;
        --boot-ok: #4ade80;
        --boot-track: #1c212b;
      }

      #boot-loader.done {
        opacity: 0;
        visibility: hidden;
      }

      .bl-term {
        width: min(430px, calc(100vw - 40px));
        border: 1px solid var(--boot-border);
        border-radius: 14px;
        background: var(--boot-card);
        overflow: hidden;
      }

      .bl-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.55rem 0.9rem;
        border-bottom: 1px solid var(--boot-border);
      }

      .bl-title {
        color: var(--boot-text);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .bl-tag {
        padding: 0.1rem 0.5rem;
        border: 1px solid var(--boot-border);
        border-radius: 999px;
        color: var(--boot-accent);
        font-size: 0.6rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .bl-body {
        display: grid;
        gap: 0.32rem;
        padding: 0.95rem 1.05rem 1.05rem;
      }

      /* Typing: each line is clamped to its final character width and revealed
         with steps(), one char per step. --w must equal the line's exact char
         count so the reveal never clips or drifts. */
      .bl-line {
        --w: 27ch;
        width: 0;
        overflow: hidden;
        color: var(--boot-text);
        font-size: 0.8rem;
        line-height: 1.55;
        white-space: nowrap;
        animation: bl-type 0.3s steps(27, end) 0.36s forwards;
      }

      .bl-l1 {
        --w: 14ch;
        animation-duration: 0.26s;
        animation-delay: 0.05s;
        animation-timing-function: steps(14, end);
      }

      .bl-l3 {
        animation-delay: 0.68s;
      }

      .bl-l4 {
        animation-delay: 1s;
      }

      .bl-l5 {
        --w: 8ch;
        animation-duration: 0.16s;
        animation-delay: 1.32s;
        animation-timing-function: steps(8, end);
      }

      @keyframes bl-type {
        to {
          width: var(--w);
        }
      }

      .bl-accent {
        color: var(--boot-accent);
        font-weight: 700;
      }

      .bl-mute {
        color: var(--boot-mute);
      }

      .bl-ok {
        color: var(--boot-ok);
        font-weight: 700;
      }

      .bl-cursor {
        display: inline-block;
        width: 0.58em;
        height: 1em;
        margin-left: 0.14em;
        vertical-align: text-bottom;
        background: var(--boot-accent);
        animation: bl-blink 1.06s steps(2, start) infinite;
      }

      @keyframes bl-blink {
        to {
          visibility: hidden;
        }
      }

      .bl-name {
        margin: 0.35rem 0 0;
        color: var(--boot-text);
        font-size: 0.92rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .bl-role {
        margin: -0.55rem 0 0;
        color: var(--boot-mute);
        font-size: 0.7rem;
        letter-spacing: 0.08em;
      }

      .bl-track {
        width: 148px;
        height: 3px;
        margin-top: 0.45rem;
        border-radius: 999px;
        background: var(--boot-track);
        overflow: hidden;
      }

      .bl-thumb {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: var(--boot-accent);
        animation: bl-slide 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes bl-slide {
        from {
          transform: translateX(-110%);
        }

        to {
          transform: translateX(340%);
        }
      }

      @media (max-width: 480px) {
        #boot-loader {
          gap: 0.75rem;
        }

        .bl-body {
          padding: 0.85rem 0.9rem 0.95rem;
        }

        .bl-line {
          font-size: 0.72rem;
        }

        .bl-name {
          font-size: 0.84rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bl-line {
          width: var(--w);
          animation: none;
        }

        .bl-cursor {
          animation: none;
        }

        .bl-thumb {
          animation: none;
          transform: translateX(60%);
        }
      }
    </style>

    <!-- Dismiss the boot loader the moment React mounts. The typed log keeps a
         short minimum display so it always finishes playing on fast loads; under
         prefers-reduced-motion that minimum shrinks to almost nothing. -->
    <script>
      (function () {
        var loader = document.getElementById('boot-loader');
        var root = document.getElementById('root');
        if (!loader || !root) return;
        var startedAt = Date.now();
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var minDisplay = reduce ? 250 : 1450;
        var dismissed = false;
        function dismiss() {
          if (dismissed) return;
          dismissed = true;
          var wait = Math.max(0, minDisplay - (Date.now() - startedAt));
          setTimeout(function () {
            loader.classList.add('done');
            setTimeout(function () {
              loader.remove();
            }, 450);
          }, wait);
        }
        if (root.childElementCount > 0) {
          dismiss();
          return;
        }
        var observer = new MutationObserver(function () {
          if (root.childElementCount > 0) {
            observer.disconnect();
            dismiss();
          }
        });
        observer.observe(root, { childList: true });
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
