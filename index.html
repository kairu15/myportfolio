<!doctype html>
<html lang="en" data-theme="light" data-accent="indigo" data-backdrop="waves">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Kylle Ian Acibron — Aspiring Web Developer</title>
    <meta
      name="description"
      content="Kylle Ian Acibron is an Information Technology student and aspiring web developer in Negros Oriental, Philippines, building web systems with Laravel, Django, React and MySQL."
    />
    <meta name="author" content="Kylle Ian Acibron" />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0f14" media="(prefers-color-scheme: dark)" />

    <!-- Default Render URL from render.yaml. Update here, in og:url and in the
         JSON-LD below if you rename the service or add a custom domain. -->
    <link rel="canonical" href="https://kylle-portfolio.onrender.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kylle Ian Acibron" />
    <meta property="og:title" content="Kylle Ian Acibron — Aspiring Web Developer" />
    <meta
      property="og:description"
      content="IT student focused on web development and practical software solutions, in Negros Oriental, Philippines."
    />
    <meta property="og:url" content="https://kylle-portfolio.onrender.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kylle Ian Acibron — Aspiring Web Developer" />
    <meta
      name="twitter:description"
      content="IT student focused on web development and practical software solutions, in Negros Oriental, Philippines."
    />
    <meta property="og:image" content="https://kylle-portfolio.onrender.com/og-image.png" />
    <meta name="twitter:image" content="https://kylle-portfolio.onrender.com/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Apply saved appearance before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var el = document.documentElement;
          var theme = localStorage.getItem('theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          }
          el.dataset.theme = theme;

          var accent = localStorage.getItem('accent');
          el.dataset.accent =
            accent === 'teal' || accent === 'clay' || accent === 'indigo'
              ? accent
              : 'indigo';

          var backdrops = ['waves', 'slats', 'dots', 'plain'];
          var backdrop = localStorage.getItem('backdrop');
          if (backdrops.indexOf(backdrop) === -1) {
            backdrop = localStorage.getItem('background') === 'dots' ? 'dots' : 'waves';
          }
          el.dataset.backdrop = backdrop;
        } catch (error) {
          /* storage blocked — keep the defaults written in the html tag */
        }
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Kylle Ian Acibron",
        "jobTitle": "Aspiring Web Developer",
        "email": "mailto:kylleacibron@gmail.com",
        "url": "https://kylle-portfolio.onrender.com/",
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "Negros Oriental",
          "addressCountry": "PH"
        },
        "affiliation": {
          "@type": "CollegeOrUniversity",
          "name": "Negros Oriental State University"
        },
        "sameAs": ["https://github.com/kairu15"]
      }
    </script>
  </head>
  <body>
    <!-- Static first-paint skeleton: displayed by the browser while the JS
         bundle downloads and parses, then cleared entirely when React mounts.
         Pure CSS, mirrors the hero's real layout, and renders nothing at all
         under prefers-reduced-motion (no movement, just static shapes). -->
    <div id="root">
      <div class="boot-skel" role="presentation" aria-hidden="true">
        <div class="boot-copy">
          <span class="bs bs-line" style="--w: 9rem"></span>
          <span class="bs bs-title"></span>
          <span class="bs bs-title" style="--w: 58%"></span>
          <span class="bs bs-line" style="--w: 15rem"></span>
          <div class="boot-actions">
            <span class="bs bs-btn"></span>
            <span class="bs bs-btn" style="--w: 7rem"></span>
          </div>
          <div class="boot-focus">
            <span class="bs bs-dot"></span>
            <span class="bs bs-dot"></span>
            <span class="bs bs-dot"></span>
          </div>
        </div>
        <span class="bs bs-photo"></span>
      </div>
    </div>

    <style>
      #root:empty {
        /* React has mounted; never let a stray skeleton linger. */
        display: none;
      }
      .boot-skel {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: clamp(2.25rem, 6vw, 3.5rem);
        max-width: 1100px;
        padding: clamp(3rem, 7vw, 5.5rem) clamp(1.25rem, 5vw, 2.5rem) 4rem;
      }
      .boot-copy {
        display: grid;
        gap: 1rem;
      }
      .bs {
        width: var(--w, 100%);
        border-radius: 8px;
        background-color: var(--boot-bg);
        background-image: linear-gradient(100deg, transparent 30%, var(--boot-shine) 46%, transparent 62%);
        background-repeat: no-repeat;
        background-size: 260% 100%;
        animation: boot-sweep 2s ease-in-out infinite;
      }
      .bs-title {
        height: clamp(2rem, 5.6vw, 3.2rem);
        border-radius: 10px;
      }
      .bs-line { height: 0.95rem; }
      .boot-actions {
        display: flex;
        gap: 0.65rem;
        margin-top: 0.7rem;
      }
      .bs-btn {
        width: 9.5rem;
        height: 2.7rem;
        border-radius: 999px;
      }
      .boot-focus {
        display: flex;
        gap: 0.9rem;
        margin-top: 0.9rem;
      }
      .bs-dot {
        width: 4.5rem;
        height: 0.55rem;
      }
      .bs-photo {
        width: min(300px, 34vw);
        height: auto;
        aspect-ratio: 1;
        border-radius: 50%;
      }
      :root .boot-skel {
        --boot-bg: #f3f1ec;
        --boot-shine: rgba(255, 255, 255, 0.55);
      }
      :root[data-theme='dark'] .boot-skel {
        --boot-bg: #171c25;
        --boot-shine: rgba(240, 242, 246, 0.07);
      }
      @keyframes boot-sweep {
        from { background-position: -110% 0; }
        to { background-position: 110% 0; }
      }
      @media (max-width: 900px) {
        .boot-skel { grid-template-columns: 1fr; }
        .bs-photo { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .bs { animation: none; }
      }
    </style>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
